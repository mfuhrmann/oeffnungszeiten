apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-changedetection
  namespace: flux-system
spec:
  # No dependsOn: no database, no Ingress, cluster-default storage.
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/changedetection
  prune: true
