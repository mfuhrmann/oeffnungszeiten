suite: Sync CronJob gating
templates:
  - 'sync-cronjob.yaml'
tests:
  - it: renders nothing by default
    # A CronJob without a real repository would fail at git clone every hour.
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses to render when enabled without a repository
    set:
      sync:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "sync.enabled requires sync.repo (the repository holding entries/)"

  - it: reconciles in plan-only mode unless apply is set
    set:
      sync:
        enabled: true
        repo: https://github.com/mfuhrmann/oeffnungszeiten.git
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: "--apply"

  - it: passes --apply when told to
    set:
      sync:
        enabled: true
        repo: https://github.com/mfuhrmann/oeffnungszeiten.git
        apply: true
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: "entries_sync.py .*--apply"

  - it: never runs two reconciles at once
    set:
      sync:
        enabled: true
        repo: https://github.com/mfuhrmann/oeffnungszeiten.git
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  # Deletion is the one operation that cannot be taken back from a CronJob, so it stays off
  # unless asked for, and it never runs without its guard.
  - it: does not prune unless told to
    set:
      sync:
        enabled: true
        repo: https://github.com/mfuhrmann/oeffnungszeiten.git
        apply: true
    asserts:
      - notMatchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: "--prune"

  - it: prunes with a limit, never bare
    set:
      sync:
        enabled: true
        repo: https://github.com/mfuhrmann/oeffnungszeiten.git
        apply: true
        prune: true
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: "--prune --max-prune 5"

  - it: tells the relay where to post a deletion
    set:
      sync:
        enabled: true
        repo: https://github.com/mfuhrmann/oeffnungszeiten.git
        apply: true
        prune: true
      matrixRelay:
        enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RELAY_URL
            value: "http://changedetection-matrix-relay:8099/notify"

  - it: says nothing to a relay that is switched off
    set:
      sync:
        enabled: true
        repo: https://github.com/mfuhrmann/oeffnungszeiten.git
        apply: true
        prune: true
      matrixRelay:
        enabled: false
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RELAY_URL
            value: "http://changedetection-matrix-relay:8099/notify"

  - it: carries a label of its own, so the relay policy can name it
    # Without a label the pod is invisible to the relay's NetworkPolicy and its prune message is
    # dropped on the last hop. The app's own name would be worse: the Deployment's ReplicaSet
    # selector would adopt the pod and then delete it.
    set:
      sync:
        enabled: true
        repo: https://github.com/mfuhrmann/oeffnungszeiten.git
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels['app.kubernetes.io/name']
          value: changedetection-sync
