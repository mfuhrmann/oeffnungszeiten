apiVersion: v1
kind: Service
metadata:
  name: {{ include "changedetection.name" . }}
  labels: {{- include "changedetection.labels" . | nindent 4 }}
spec:
  # ClusterIP on purpose — see values.yaml for why there is no Ingress.
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "changedetection.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
