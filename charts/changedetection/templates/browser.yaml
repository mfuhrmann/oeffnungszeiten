{{- if .Values.browser.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "changedetection.name" . }}-browser
  labels: {{- include "changedetection.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.browser.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "changedetection.name" . }}-browser
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "changedetection.name" . }}-browser
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: browser
          image: "{{ .Values.browser.image.repository }}:{{ .Values.browser.image.tag }}{{ with .Values.browser.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.browser.image.pullPolicy }}
          ports:
            - name: cdp
              containerPort: 3000
          env:
            - name: SCREEN_WIDTH
              value: "1920"
            - name: SCREEN_HEIGHT
              value: "1024"
            - name: SCREEN_DEPTH
              value: "16"
            - name: MAX_CONCURRENT_CHROME_PROCESSES
              value: "{{ .Values.browser.maxConcurrentChromeProcesses }}"
          securityContext:
            # Chrome's sandbox needs it.
            capabilities:
              add: ["SYS_ADMIN"]
          # sockpuppetbrowser speaks WebSocket only and answers HTTP 426 on every path, so an
          # httpGet probe would mark a healthy browser unhealthy. TCP covers both cases that
          # matter: a rolling replacement must not take traffic before Chrome accepts CDP, and a
          # wedged listener has to be restarted rather than failing every JS watch silently.
          readinessProbe:
            tcpSocket: { port: cdp }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: cdp }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.browser.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "changedetection.name" . }}-browser
  labels: {{- include "changedetection.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: cdp
      name: cdp
  selector:
    app.kubernetes.io/name: {{ include "changedetection.name" . }}-browser
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
