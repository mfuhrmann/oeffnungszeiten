{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "changedetection.name" . }}-data
  annotations:
    # Survive a Helm uninstall. Flux remediates a failed *install* by uninstalling and retrying,
    # so without this a re-install that trips over a slow image pull or a pending volume would
    # take the datastore with it. There is no backup. Cost: a deliberate uninstall leaves the
    # claim behind and it has to be deleted by hand.
    helm.sh/resource-policy: keep
  labels: {{- include "changedetection.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
