---
name: "Update the container images"

# Run with `updatecli diff --config updatecli.d/`.

sources:
  changedetection:
    name: "Get latest changedetection.io version tag"
    kind: dockerimage
    spec:
      image: "ghcr.io/dgtlmoon/changedetection.io"
      versionFilter:
        kind: "semver"
        pattern: "*"

  # sockpuppetbrowser has no usable semver stream: :latest is newer than its highest version
  # tag (0.0.3), so tracking the version would roll the browser BACKWARDS. Track the digest
  # of :latest instead — a bump is then a visible one-line diff rather than a silent pull.
  sockpuppetbrowser:
    name: "Get current sockpuppetbrowser :latest digest"
    kind: dockerdigest
    spec:
      image: "dgtlmoon/sockpuppetbrowser"
      tag: "latest"

# The chart is the only place an image is pinned, so these two targets are the whole surface.
targets:
  chart-changedetection-tag:
    name: "chart: image.tag"
    kind: yaml
    sourceid: changedetection
    spec:
      file: "charts/changedetection/values.yaml"
      key: "$.image.tag"

  chart-browser-digest:
    name: "chart: browser.image.digest"
    kind: yaml
    sourceid: sockpuppetbrowser
    spec:
      file: "charts/changedetection/values.yaml"
      key: "$.browser.image.digest"
