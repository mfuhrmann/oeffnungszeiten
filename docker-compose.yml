services:
  # One-shot: merge the managed global settings (25 global_ignore_text patterns, the recheck
  # interval) into the datastore BEFORE changedetection starts. It cannot be done later — the
  # app has no settings API, reads changedetection.json only at startup, and overwrites it from
  # memory on its next commit, so a live edit is invisible and then lost. Same job the
  # initContainer does on Kubernetes, reading the same deploy/global-settings.json, so the two
  # deployments cannot drift.
  apply-settings:
    image: python:3.12-alpine
    container_name: changedetection-apply-settings
    volumes:
      - changedetection-data:/datastore
      - ./scripts/apply_global_settings.py:/app/apply.py:ro
      - ./deploy/global-settings.json:/app/global-settings.json:ro
    command: ["python3", "/app/apply.py", "--settings", "/app/global-settings.json",
              "--datastore", "/datastore/changedetection.json"]
    restart: "no"

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.55.8
    container_name: changedetection
    restart: unless-stopped
    ports:
      # Bound to localhost on purpose. changedetection has a single shared password (unset by
      # default) and no user model, and an authenticated user can point a watch at any URL —
      # which makes an exposed instance an SSRF pivot. Use a tunnel or a reverse proxy with
      # real auth if you need remote access.
      - "127.0.0.1:5000:5000"
    volumes:
      - changedetection-data:/datastore
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000
      # Set your base URL so notification links work (optional)
      # - BASE_URL=http://localhost:5000
    depends_on:
      playwright-chrome:
        condition: service_started
      apply-settings:
        condition: service_completed_successfully

  playwright-chrome:
    # Pinned by digest: sockpuppetbrowser's :latest is NEWER than its highest version
    # tag (0.0.3), so pinning to the version tag would be a downgrade from the build
    # this project has actually been running against.
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:7116c61ef9cfce3d48a7efd9355d2fbe19f593ea3cfb52a5ded40ecbcb0a3f9d
    container_name: playwright-chrome
    restart: unless-stopped
    ports:
      # Published so the browser is usable ON ITS OWN — `docker compose up -d playwright-chrome`
      # is all `filter_wizard.py --browser-ws ws://localhost:3000` needs. Rendering no longer
      # goes through changedetection (scripts/cdp_render.py speaks CDP from the host), so
      # proposing a filter for a JavaScript page does not require the rest of this file.
      # localhost-bound: it is an unauthenticated browser that will fetch any URL you hand it.
      - "127.0.0.1:3000:3000"
    cap_add:
      - SYS_ADMIN
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10

  # No matrix-relay here on purpose: notifications belong to the deployment, so the relay will
  # arrive as a chart template — Deployment plus a small volume for its session state.

volumes:
  changedetection-data:
